<!DOCTYPE html>
<html lang="en" style="background: transparent;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <title>蔚蓝档案登录器</title>
    <style>
      /* ===== 应用加载动画：由 index.html 静态渲染，Vue bundle 加载前即可显示，避免白屏 =====
         加载层保持纯透明（角色悬浮于透明窗口之上），页面由渲染进程在加载动画
         完全结束（淡出移除）后才挂载，保证动画期间页面不会透出 */
      #app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        z-index: 999;
        transition: opacity 0.6s ease;
        font-family: 'MiSans', 'HarmonyOS Sans SC', 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
        user-select: none;
      }

      #app-loading.finish {
        opacity: 0;
        pointer-events: none;
      }

      .loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        margin-bottom: 36px;
      }

      /* ===== 角色舞台 ===== */
      .character-stage {
        position: relative;
        width: 220px;
        height: 320px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      .loading-image {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 300px;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        animation: float 2.4s ease-in-out infinite;
        pointer-events: none;
      }

      .loading-image.active {
        opacity: 1;
      }

      @keyframes float {
        0%, 100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(-18px);
        }
      }

      /* ===== 角色背景光晕与光环 ===== */
      .core-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 300px;
        height: 380px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(18, 138, 250, 0.28) 0%, rgba(56, 182, 246, 0.14) 45%, transparent 72%);
        opacity: 0.7;
        animation: glow-breathe 2.8s ease-in-out infinite;
        pointer-events: none;
      }

      .halo-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 280px;
        height: 360px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1.5px dashed rgba(18, 138, 250, 0.35);
        animation: halo-spin 16s linear infinite;
        pointer-events: none;
      }

      .halo-ring::after {
        content: "";
        position: absolute;
        inset: 14px;
        border-radius: 50%;
        border: 1px solid rgba(56, 182, 246, 0.18);
      }

      @keyframes glow-breathe {
        0%, 100% {
          transform: translate(-50%, -50%) scale(0.88);
          opacity: 0.55;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
          opacity: 1;
        }
      }

      @keyframes halo-spin {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      /* ===== 渐变进度条 ===== */
      .progress-track {
        position: relative;
        width: 260px;
        height: 6px;
        border-radius: 999px;
        background: rgba(18, 138, 250, 0.12);
        box-shadow: inset 0 1px 2px rgba(15, 98, 200, 0.08);
        overflow: hidden;
      }

      .progress-bar {
        position: relative;
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #0e7be8 0%, #38b6f6 60%, #6fd3fa 100%);
        box-shadow: 0 0 10px rgba(56, 182, 246, 0.5);
        transition: width 0.2s ease-out;
      }

      /* 进度条流动高光 */
      .progress-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
        transform: translateX(-100%);
        animation: bar-shine 1.6s ease-in-out infinite;
      }

      @keyframes bar-shine {
        0% {
          transform: translateX(-100%);
        }
        60%, 100% {
          transform: translateX(100%);
        }
      }

      /* 加载进度百分比（蓝色文字适配白色背景） */
      .loading-progress {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 2px;
      }

      .progress-num {
        font-size: 26px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.5px;
        color: #38b6f6;
        text-shadow: 0 0 12px rgba(56, 182, 246, 0.45);
      }

      .progress-sym {
        font-size: 16px;
        font-weight: 600;
        color: #6fd3fa;
        text-shadow: 0 0 10px rgba(111, 211, 250, 0.4);
      }
    </style>
  </head>
  <body style="background: transparent;">
    <div id="app" style="background: transparent;"></div>

    <!-- 应用加载动画：Vue 应用挂载前静态渲染，挂载完成后由 __removeLoading__ 移除 -->
    <div id="app-loading">
      <div class="loading-inner">
        <div class="character-stage">
          <div class="core-glow"></div>
          <div class="halo-ring"></div>
          <img class="loading-image" src="/imgs/ALuoNa01.png" alt="loading" />
          <img class="loading-image" src="/imgs/ALuoNa02.png" alt="loading" />
          <img class="loading-image" src="/imgs/ALuoNa03.png" alt="loading" />
          <img class="loading-image" src="/imgs/ALuoNa04.png" alt="loading" />
        </div>
        <div class="progress-track">
          <div class="progress-bar"></div>
        </div>
        <div class="loading-progress">
          <span class="progress-num">0</span><span class="progress-sym">%</span>
        </div>
      </div>
    </div>

    <script>
      (function () {
        // 最短展示时长：应用初始化过快时也保证用户能体验到加载动画
        var MIN_DISPLAY_MS = 3000;
        // 兜底超时：应用长时间未完成初始化时自动移除，避免加载层永久遮挡
        var SAFE_TIMEOUT_MS = 20000;
        var startedAt = Date.now();
        var finished = false;
        var finishHandlers = [];

        var loadingEl = document.getElementById('app-loading');
        if (!loadingEl) {
          window.__loadingDone__ = Promise.resolve();
          return;
        }
        var numEl = loadingEl.querySelector('.loading-progress .progress-num');
        var barEl = loadingEl.querySelector('.progress-bar');

        // 角色图轮播：每 1 秒切换一张，首张立即显示
        var images = loadingEl.querySelectorAll('.loading-image');
        var currentIndex = 0;
        if (images.length > 0) images[currentIndex].classList.add('active');
        setInterval(function () {
          images[currentIndex].classList.remove('active');
          currentIndex = (currentIndex + 1) % images.length;
          images[currentIndex].classList.add('active');
        }, 1000);

        // 模拟加载进度：先快后慢（剩余越多增长越快），封顶 99.2%，移除时强制跳到 100%
        var progress = 0;
        var progressTimer = setInterval(function () {
          progress += Math.max((100 - progress) * 0.05, 0.2);
          if (progress >= 99.2) progress = 99.2;
          if (numEl) numEl.textContent = Math.floor(progress);
          if (barEl) barEl.style.width = progress + '%';
        }, 100);

        // 完成加载：进度读满 → 淡出 → 移除 DOM 并通知等待方（渲染进程此时才挂载页面）
        function finishLoading() {
          if (finished) return;
          finished = true;
          clearInterval(progressTimer);
          if (numEl) numEl.textContent = '100';
          if (barEl) barEl.style.width = '100%';
          loadingEl.classList.add('finish');
          setTimeout(function () {
            if (loadingEl.parentNode) loadingEl.parentNode.removeChild(loadingEl);
            finishHandlers.forEach(function (fn) { fn(); });
            finishHandlers = [];
          }, 600);
        }

        // 渲染进程在应用初始化完成后调用：保证最短展示时长后再淡出
        window.__removeLoading__ = function () {
          if (finished) return;
          var waitMs = Math.max(0, MIN_DISPLAY_MS - (Date.now() - startedAt));
          setTimeout(finishLoading, waitMs);
        };

        // 渲染进程等待此 Promise：加载动画完全结束后再挂载页面，保证透明加载层期间页面不透出
        window.__loadingDone__ = new Promise(function (resolve) {
          if (finished) resolve();
          else finishHandlers.push(resolve);
        });

        // 兜底：应用长时间未完成初始化时自动结束加载层
        setTimeout(window.__removeLoading__, SAFE_TIMEOUT_MS);
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
